name: fahrdienst_app
description: Fahrdienst-App für Kunden und Fahrer (Dispatch, Live-Tracking, Bewertung).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
